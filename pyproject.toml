[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibed-mujoco-supermimic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "joblib", "mujoco>=3.3", "torch>=2.5", "tqdm"]

[project.scripts]
supermimic = "supermimic.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
data = ["huggingface_hub", "pyarrow"]
warp = ["mujoco==3.11.0", "mujoco-warp==3.11.0", "warp-lang==1.17.0", "torch>=2.7"]
